name: verdantis

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verdantis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verdantis}
      POSTGRES_DB: ${POSTGRES_DB:-verdantis}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-verdantis}:${POSTGRES_PASSWORD:-verdantis}@db:5432/${POSTGRES_DB:-verdantis}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      SIGNING_KEY_SEED: ${SIGNING_KEY_SEED:-}
      CORS_ORIGINS: ${WEB_PUBLIC_URL:-http://localhost:3000}
      PUBLIC_WEB_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "8080:8080"

volumes:
  db-data:
